[project]
name = "task-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivsharan", email = "shivsharan.sanjawad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mongomock>=4.3,<5",
    "motor>=3.7,<4",
    "networkx>=3.4,<4",
    "openai>=1.60,<4",
    "openpyxl>=3.1,<4",
    "pydantic>=2.9,<3",
    "pymongo>=4.9,<5",
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "reportlab>=4,<6",
    "uvicorn>=0.30,<1",
]

[project.scripts]
task-backend = "task_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
